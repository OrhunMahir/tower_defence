<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castle Defense</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#fff;font-family:system-ui,-apple-system,sans-serif;user-select:none}
  canvas{display:block}
  [hidden]{display:none !important}
  .hud{position:absolute;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .panel{background:rgba(14,18,24,.66);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px);text-shadow:none}
  .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;width:100%;border-radius:5px;transition:width .12s linear}
  .lbl{font-size:12px;opacity:.85;display:flex;justify-content:space-between;gap:12px}
  button{font:inherit;cursor:pointer}
  #top{top:12px;left:50%;transform:translateX(-50%);text-align:center}
  @media (min-width:1100px){#waves{left:50% !important}}
  #phase{font-size:17px;font-weight:600}
  #sub{font-size:12.5px;opacity:.8;margin:2px 0 10px}
  #boss{width:340px}
  #left{top:12px;left:12px;width:230px}
  #left .lbl+.lbl{margin-top:7px}
  #shop{top:12px;right:12px;width:290px;pointer-events:auto;font-size:13px;max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box}
  #shop h3{margin:8px 0 4px;font-size:11px;font-weight:600;opacity:.65;letter-spacing:.04em;text-transform:uppercase}
  #shop h3:first-child{margin-top:0}
  #shop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.1)}
  #shop .row b{display:block;font-weight:600}
  #shop .row i{font-style:normal;opacity:.65;font-weight:400}
  #shop .row span{display:block;font-size:11.5px;opacity:.7;line-height:1.35;margin-top:1px}
  #shop .btns{display:flex;flex-direction:column;gap:4px;flex:none}
  #shop button{font-size:12px;white-space:nowrap;padding:5px 9px;border-radius:7px;border:0;background:#e9b949;color:#1b1400;font-weight:600}
  #shop button.alt{background:rgba(255,255,255,.16);color:#fff}
  #shop button:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4);cursor:default}
  #shop button.perk{display:block;width:100%;text-align:left;white-space:normal;background:rgba(233,185,73,.16);color:#fff;border:1px solid #e9b949;margin-bottom:6px;padding:8px 10px}
  #shop button.perk:hover{background:rgba(233,185,73,.32)}
  #shop p{margin:8px 0 0;font-size:12px;opacity:.75}
  #waves{bottom:14px;left:calc(50% - 151px);transform:translateX(-50%);pointer-events:auto;text-align:center;width:min(560px,calc(100% - 340px));min-width:280px}
  #waves h3{margin:0 0 8px;font-size:14px;font-weight:600}
  #waves .cards{display:flex;gap:10px}
  #waves button{flex:1;text-align:left;color:#fff;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07)}
  #waves button:hover{background:rgba(255,255,255,.16);border-color:#e9b949}
  #waves button.hard{border-color:rgba(229,72,77,.7)}
  #waves .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:rgba(76,195,107,.25);color:#9be8b1;margin-bottom:6px}
  #waves .hard .tag{background:rgba(229,72,77,.25);color:#ffb0b3}
  #waves .mons{font-size:14px;line-height:1.5}
  #waves .mons b{font-weight:600}
  #waves .gold{margin-top:6px;font-size:13px;color:#f3d27a}
  #help{top:182px;left:14px;font-size:12px;opacity:.7;line-height:1.5}
  #toast{top:24%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:600;text-align:center;opacity:0;transition:opacity .4s}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.78);backdrop-filter:blur(4px)}
  #overlay .box{text-align:center;max-width:560px;padding:24px}
  #overlay h1{font-size:36px;margin:0 0 6px}
  #overlay p{opacity:.8;margin:0 0 22px;line-height:1.5}
  #menu{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  #menu>button,#menu>form{color:#fff;width:220px;padding:16px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);text-align:left;box-sizing:border-box}
  #menu>button:hover{background:rgba(255,255,255,.16);border-color:#e9b949}
  #menu b{display:block;font-size:18px;margin-bottom:4px}
  #menu span{font-size:13px;opacity:.75;line-height:1.4;display:block}
  #menu form{margin:0;display:flex;flex-direction:column;gap:8px}
  #menu input{font:inherit;font-size:18px;letter-spacing:.2em;text-transform:uppercase;padding:6px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;width:100%;box-sizing:border-box}
  #menu form button{padding:7px;border-radius:7px;border:0;background:#e9b949;color:#1b1400;font-weight:600}
  #ovErr{color:#ffb0b3;margin-top:14px;min-height:1.2em;font-size:14px}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="top" class="hud">
  <div id="boss" class="panel" hidden><div class="lbl"><span>Queen</span><span id="bossTxt"></span></div><div class="bar"><i id="bossBar" style="background:#ff2a6a"></i></div></div>
</div>
<div id="left" class="hud panel" hidden>
  <div id="phase"></div>
  <div id="sub"></div>
  <div class="lbl"><span>Keep</span><span id="thTxt"></span></div>
  <div class="bar"><i id="thBar" style="background:#e9b949"></i></div>
  <div class="lbl" style="margin-top:10px"><span>Gold</span><span id="gold">0</span></div>
  <div class="lbl"><span>Defenders</span><span id="army"></span></div>
  <div class="lbl" id="roomRow" hidden><span>Room <b id="roomCode"></b></span><span id="roomPlayers"></span></div>
</div>
<div id="shop" class="hud panel" hidden></div>
<div id="waves" class="hud panel" hidden></div>
<div id="help" class="hud" hidden>WASD / arrows: move camera · Wheel: zoom<br>1 / 2: pick a wave</div>
<div id="toast" class="hud"></div>
<div id="overlay">
  <div class="box">
    <h1 id="ovTitle">Castle Defense</h1>
    <p id="ovText">You command the castle. Pick which wave to face, recruit defenders for the walls and upgrade the keep. When the keep falls, the run starts over.</p>
    <div id="menu">
      <button id="playSolo"><b>Play solo</b><span>Your own castle, your own pace.</span></button>
      <button id="playCreate"><b>Create co-op room</b><span>Get a code and share it with up to three friends.</span></button>
      <form id="playJoin"><b>Join a room</b><input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" aria-label="Room code"><button>Join</button></form>
    </div>
    <div id="ovErr"></div>
  </div>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
