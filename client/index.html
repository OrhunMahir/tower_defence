<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hordewall</title>
<meta name="description" content="Hordewall: a round-based castle defense roguelite without a last wave. Hold the walls through the seasons while the horde mutates and adapts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500;1,700&family=Alegreya+Sans+SC:wght@700&display=swap" rel="stylesheet">
<style>
  /* The look: a board game somebody made by hand. Flat paint, dark pen outlines, paper slips,
     corners that are never quite square, hard shadows instead of glows. No gradients, no blur. */
  :root{
    --ink:#f3ead8; --dim:rgba(243,234,216,.74); --faint:rgba(243,234,216,.47);
    --board:#251e18; --board2:#32281f; --hole:#18120e; --pen:#0f0b09;
    --paper:#eadcbb; --paperink:#2a1f17;
    --line:rgba(234,220,187,.13); --line2:rgba(234,220,187,.3);
    --gold:#e6b84a; --gold2:#f0d080; --red:#d9573f; --green:#86b96b; --blue:#7fb4da;
    --good:#a9d896; --bad:#f0a595; --cool:#b9d6ea;
    --r0:#b9b2a3; --r1:#6fa9d8; --r2:#aa8bdb; --r3:#e6b84a; --r4:#e2727d; --r5:#f6ecc6;
    --head:'Grenze Gotisch',Georgia,serif; --head2:'Alegreya Sans SC','Alegreya Sans','Trebuchet MS',sans-serif; --body:'Alegreya Sans','Trebuchet MS','Segoe UI',sans-serif;
    --cut:5px 8px 6px 9px/8px 5px 9px 6px; --cut2:3px 5px 4px 6px/5px 3px 6px 4px; --slip:2px 4px 3px 5px/4px 2px 5px 3px;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:var(--ink);font-family:var(--body);font-size-adjust:.53;user-select:none;font-size:13px}
  canvas{display:block}
  [hidden]{display:none !important}
  button{font:inherit;cursor:pointer;color:inherit}
  .hud{position:absolute;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .panel{background:var(--board);border:2px solid var(--pen);border-radius:var(--cut);padding:12px 14px;text-shadow:none;box-shadow:inset 0 0 0 1px var(--line),3px 4px 0 rgba(0,0,0,.42)}
  .bar{height:10px;border-radius:3px;background:var(--hole);box-shadow:inset 0 0 0 1.5px var(--pen);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;width:100%;transition:width .15s linear}
  .lbl{font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;align-items:center}
  .lbl b{color:var(--ink);font-weight:700}
  h2,h3,.title{font-family:var(--head);font-weight:700}

  /* Pictures and glyphs (drawn in icons.js) take their size from the text around them. */
  .ico{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;overflow:visible;flex:none}
  .ico.g{width:1em;height:1em;vertical-align:-.14em;margin-right:3px;--sw:4.4px}
  .ico.c{width:1.12em;height:1.12em;vertical-align:-.2em;margin-right:3px;--sw:3px;--edge:transparent}

  /* Buttons */
  .btn{border:2px solid var(--pen);border-radius:var(--cut2);padding:6px 11px;font-weight:700;font-size:12.5px;background:var(--gold);color:#241a08;box-shadow:0 2px 0 var(--pen);white-space:nowrap}
  .btn:hover{background:var(--gold2)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.alt{background:var(--board2);color:var(--ink)}
  .btn.alt:hover{background:#3d3127}
  .btn.warn{background:#5a231c;color:#ffcfc4}
  .btn:disabled{background:#2b241e;color:var(--faint);border-color:#191310;box-shadow:none;cursor:default;transform:none}

  /* Status */
  #status{top:14px;left:14px;width:250px}
  #phase{font-family:var(--head);font-size:25px;line-height:1;font-weight:700;color:var(--gold2)}
  #sub{font-size:12.5px;color:var(--dim);margin:3px 0 10px;font-style:italic}
  #status .lbl+.lbl{margin-top:7px}
  #goldTxt{font-size:16px;color:var(--gold2);font-weight:800}
  #boss{width:380px}
  #boss .lbl{font-family:var(--head);font-size:17px;color:var(--ink)}
  #top{top:14px;left:50%;transform:translateX(-50%);text-align:center}

  /* Right panel with tabs */
  #shop{top:14px;right:14px;width:356px;pointer-events:auto;max-height:calc(100% - 76px);display:flex;flex-direction:column;box-sizing:border-box;padding:0;overflow:hidden}
  #tabs{display:flex;gap:2px;padding:8px 10px 0}
  #tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:transparent;padding:6px 0 7px;font-family:var(--head2);font-weight:700;font-size:13px;color:var(--faint)}
  #tabs button.on{color:var(--gold2);border-bottom-color:var(--gold)}
  #tabs button i{font-style:normal;font-family:var(--body);font-size:10.5px;font-weight:700;opacity:.8;margin-left:3px}
  #tabs button i.hot,.mtab i.hot{background:var(--red);color:#fff;border-radius:var(--slip);padding:0 5px;opacity:1}
  #tabBody{overflow:auto;padding:10px 12px 12px;border-top:2px solid var(--pen)}
  #tabBody::-webkit-scrollbar{width:8px}#tabBody::-webkit-scrollbar-thumb{background:rgba(234,220,187,.2);border-radius:2px}
  .sec{display:flex;justify-content:space-between;align-items:center;margin:2px 0 9px;color:var(--dim);font-size:12.5px}
  .sec b{color:var(--ink)}

  /* Cards: shop offers, recruits, rewards */
  .cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{position:relative;border-radius:var(--cut2);padding:12px 9px 8px;background:var(--board2);border:2px solid var(--pen);display:flex;flex-direction:column;gap:5px;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--rc);border-bottom:1.5px solid var(--pen)}
  .card .top{display:flex;gap:8px;align-items:center}
  .pic{width:52px;height:52px;border-radius:var(--cut2);background:var(--hole);box-shadow:inset 0 0 0 2px var(--pen);flex:none;object-fit:cover}
  .pic.emo{display:flex;align-items:center;justify-content:center;background:var(--paper);--edge:transparent}
  .pic.emo .ico{width:44px;height:44px}
  .card .nm{font-weight:800;font-size:14px;line-height:1.15}
  .card .cl{font-size:11.5px;color:var(--dim)}
  .rar{display:inline-block;font-size:11px;font-weight:500;font-style:italic;color:var(--rc)}
  .stats{display:flex;flex-wrap:wrap;gap:2px 11px;font-size:12px}
  .stats span{white-space:nowrap}
  .stats span small{font-size:10.5px;font-style:italic;color:var(--faint);margin-right:4px}
  .stats.one{display:block}
  .traits{display:flex;flex-wrap:wrap;gap:3px;min-height:18px}
  .trait{font-size:11px;padding:1px 6px;border-radius:var(--slip);background:var(--hole);color:var(--gold2);box-shadow:inset 0 0 0 1.5px var(--pen);cursor:help}
  .trait.spec{color:#d9c6f5}
  .trait.off{color:var(--faint)}
  .card .btn{width:100%}
  .card.gone{opacity:.35;justify-content:center;align-items:center;min-height:170px;font-family:var(--head);font-size:17px;color:var(--dim)}
  .card.lockd{filter:saturate(.4) brightness(.7)}
  .desc{font-size:11.5px;color:var(--dim);line-height:1.35}
  .desc.big{font-size:12.5px;color:var(--ink);line-height:1.45;margin:2px 0 4px}
  .row2{display:flex;gap:5px}.row2 .btn:first-child{flex:1}
  .lockb{width:34px;padding:0;display:flex;align-items:center;justify-content:center}.lockb .ico{margin:0;width:14px;height:14px}

  /* Army roster */
  .unit{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-top:1px dashed var(--line2)}
  .unit .pic{width:40px;height:40px;box-shadow:inset 0 0 0 2px var(--rc)}
  .unit .nm{font-weight:700;font-size:13px}
  .unit .nm i{font-style:italic;color:var(--dim);font-weight:500;font-size:11.5px}
  .unit .meta{font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
  .xp{height:4px;border-radius:2px;background:var(--hole);margin-top:4px;overflow:hidden}.xp>i{display:block;height:100%;background:var(--blue)}
  .unit .btns{display:flex;flex-direction:column;gap:4px}
  .unit .btn{padding:4px 8px;font-size:11.5px}
  .unit .btns .row2 .btn{padding:4px 6px}.unit .btns .row2 .btn .ico{margin:0}
  .unit.sel{background:rgba(230,184,74,.13);border-radius:var(--cut2)}
  .lv{display:inline-block;min-width:16px;text-align:center;font-size:11px;font-weight:800;background:var(--paper);color:var(--paperink);border-radius:var(--slip);padding:0 4px;margin-right:5px}

  /* Castle */
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line2)}
  .row>div{flex:1;min-width:0}
  .row>.btn{flex:none}
  .row>.btns{flex:none;display:flex;flex-direction:column;gap:4px}
  .row b{display:block;font-weight:700;font-size:13.5px}
  .row b i{font-style:italic;color:var(--dim);font-weight:500;font-size:11.5px;margin-left:4px}
  .row span{display:block;font-size:12px;color:var(--dim);line-height:1.35;margin-top:1px}
  .pips{display:flex;gap:2px;margin-top:4px}.pips i{width:9px;height:5px;border-radius:1px;background:var(--hole);box-shadow:inset 0 0 0 1px var(--pen)}.pips i.on{background:var(--gold)}
  .perkList{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .agebox{border:2px solid var(--pen);border-radius:var(--cut2);padding:10px 11px;margin-bottom:6px;background:var(--board2)}
  .agebox.ready{border-color:var(--gold)}
  .agebox.done{display:flex;flex-direction:column;gap:3px}.agebox.done span{font-size:12px;color:var(--dim)}
  .agehd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .agehd b,.agebox.done b{font-family:var(--head);font-size:19px;color:var(--gold2)}.agehd span{font-family:var(--head);font-size:15px;color:var(--dim)}
  .req{font-size:12.5px;color:var(--dim);padding:2px 0}.req.ok{color:var(--good)}.req i{font-style:normal;color:var(--faint)}
  #ageBtn{width:100%;margin-top:10px;white-space:normal}
  .pathrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

  /* Wave choice */
  #waves{bottom:16px;left:50%;transform:translateX(calc(-50% - 185px));pointer-events:auto;width:min(620px,calc(100% - 420px));min-width:420px;padding:12px}
  #waves.three{width:min(860px,calc(100% - 420px))}
  #waves h3{margin:0 0 6px;font-size:21px;line-height:1;text-align:center;color:var(--gold2)}
  #waves .cards{display:flex;gap:10px}
  .wcard{position:relative;flex:1;text-align:left;padding:13px 12px 10px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board2);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .12s}
  .wcard::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--green);border-bottom:1.5px solid var(--pen)}
  .wcard.hard::before{background:#e39a4e}.wcard.deadly::before{background:var(--red)}
  .wcard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .wcard .hd{display:flex;justify-content:space-between;align-items:center}
  .wcard .th{font-family:var(--head);font-weight:700;font-size:20px;line-height:1}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:0 7px;border-radius:var(--slip);background:#cfe3b0;color:var(--paperink);transform:rotate(-1.5deg)}
  .wcard.hard .tag{background:#f0bd82}.wcard.deadly .tag{background:#ee9480}
  .mon{display:grid;grid-template-columns:34px 1fr;gap:7px;align-items:center}
  .mon img{width:34px;height:34px;border-radius:var(--cut2);background:var(--hole);box-shadow:inset 0 0 0 1.5px var(--pen)}
  .mon b{font-weight:800}
  .mon .ms{font-size:11px;color:var(--dim)}
  .chip{display:inline-block;font-size:11px;font-style:italic;font-weight:500;color:var(--faint);margin-left:5px}
  .chip.boss{color:var(--bad);font-weight:700}
  .wcard .gold{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--gold2);font-weight:800;margin-top:auto}.wcard .gold .kbd{margin-left:auto}
  .xpv{color:var(--cool);font-weight:700;font-size:12.5px}.luck{color:var(--good);font-weight:700;font-size:12.5px}
  .modline,.swap{font-size:11.5px;line-height:1.35;border-radius:var(--cut2);padding:4px 7px;box-shadow:inset 0 0 0 1.5px var(--pen)}
  .modline{color:#ffd9cf;background:#4d241d}.swap{color:#ffe0b8;background:#4a3219}
  .modline b,.swap b{color:#fff}
  .kbd{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;border:1.5px solid var(--line2);color:var(--dim);font-weight:700}
  /* The day of the coming wave, above the wave cards */
  .dayline{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 9px;font-size:11.5px;line-height:1.35}

  /* Paper slips: the calendar, the weather, whatever is in force right now */
  #cal,#nowFx{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  #cal .chip,#nowFx .chip,.day,.rules .chip{margin:0;font-size:11.5px;font-style:normal;font-weight:700;padding:1px 7px 1px 5px;border-radius:var(--slip);background:#e3dcc8;color:var(--paperink);box-shadow:1px 2px 0 rgba(0,0,0,.45);cursor:help;--edge:transparent;--sw:3px}
  #cal .chip small{font-size:10px;font-weight:500;font-style:italic;opacity:.75}
  .chip.season.spring,.day.spring{background:#cfe3b0}.chip.season.summer,.day.summer{background:#f1dc9a}.chip.season.autumn,.day.autumn{background:#f0c99c}.chip.season.winter,.day.winter{background:#cfe0ee}
  #cal .chip.wx.on,.day.wx{background:#cfe0ee}
  #nowFx .chip.mod,.rules .chip.mod{background:#eea28f}#nowFx .chip.on,#cal .chip.on{background:#cfe3b0}
  .rules{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 6px;min-height:20px}
  .rules .chip.mod{cursor:default}
  #muts{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  #muts .mut{position:relative;width:26px;height:26px;border-radius:var(--slip);display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--red),1px 2px 0 rgba(0,0,0,.45);cursor:help;--edge:transparent;--sw:3px}
  #muts .mut i{position:absolute;right:-4px;bottom:-5px;font-style:normal;font-size:9.5px;font-weight:800;background:var(--red);color:#fff;border-radius:var(--slip);padding:0 3.5px;line-height:13px}
  #status{pointer-events:auto}

  /* Modals */
  #modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #modal>.panel{pointer-events:auto;max-width:720px;text-align:center;padding:22px 24px}
  #modal>.panel.wide{max-width:min(980px,calc(100% - 40px))}
  #modal h2{margin:0 0 4px;font-size:32px;line-height:1;color:var(--gold2)}
  #modal p{margin:0 0 16px;color:var(--dim)}
  .perks3{display:flex;gap:12px}
  .perk{flex:1;width:200px;padding:16px 14px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board2);text-align:left;transition:transform .12s}
  .perk:hover{border-color:var(--gold);transform:translateY(-2px)}
  .perk .pi{font-size:30px;line-height:1}
  .perk b{display:block;font-family:var(--head);font-size:20px;margin:8px 0 4px}
  .perk span{font-size:12.5px;color:var(--dim);line-height:1.4}
  .perk em{display:block;font-style:normal;font-size:11.5px;color:var(--gold2);margin-top:6px}
  .sum{display:grid;grid-template-columns:repeat(5,minmax(96px,1fr));gap:10px;margin:6px 0 16px}
  .sum div{background:var(--hole);border-radius:var(--cut2);box-shadow:inset 0 0 0 1.5px var(--pen);padding:10px}
  .sum b{display:block;font-size:27px;line-height:1.05;font-family:var(--head);color:var(--ink);white-space:nowrap}
  .sum small{color:var(--dim)}
  .hero{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:16px}
  .hero img{width:64px;height:64px;border-radius:var(--cut2);background:var(--hole);box-shadow:inset 0 0 0 2px var(--pen)}
  .hero div{text-align:left}
  .record{display:inline-block;background:var(--paper);color:var(--paperink);font-weight:800;font-size:11.5px;padding:1px 9px;border-radius:var(--slip);margin-bottom:8px;transform:rotate(-1deg);box-shadow:1px 2px 0 rgba(0,0,0,.45)}
  .record.warn{background:#ee9480}

  #help{bottom:14px;right:14px;text-align:right;font-size:12px;color:var(--dim);line-height:1.7;max-width:440px}
  #speed .sep{width:1.5px;background:var(--pen);margin:3px 4px}
  #speed button.off{opacity:.35;text-decoration:line-through}
  #dmg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dn{position:absolute;left:0;top:0;font-family:var(--head);font-weight:700;font-size:18px;color:#fff;text-shadow:1.5px 1.5px 0 #000;white-space:nowrap;will-change:transform,opacity}
  .dn.crit{color:var(--gold2);font-size:25px}
  .dn.miss{color:#a9b4bc;font-size:14px;font-weight:500}
  #advice{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:max-content;max-width:min(520px,calc(100% - 790px));min-width:300px;font-size:13.5px;line-height:1.45;z-index:5}
  #advice .ai{font-size:28px}
  #advice .btn{flex:none}
  #toast{top:22%;left:50%;transform:translateX(-50%);font-family:var(--head);font-size:42px;line-height:1;font-weight:700;text-align:center;opacity:0;transition:opacity .4s;color:var(--gold2);text-shadow:3px 3px 0 #000}
  #toast small{display:block;font-family:var(--body);font-size:15px;font-weight:500;font-style:italic;color:var(--ink);margin-top:6px;text-shadow:1.5px 1.5px 0 #000}

  /* Start menu */
  #overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(10,9,8,.66)}
  #overlay .box{position:relative;text-align:center;max-width:1000px;width:calc(100% - 40px);padding:18px 20px 30px;margin:auto}
  #overlay h1{font-family:var(--head);font-size:78px;line-height:.95;font-weight:700;margin:0;color:var(--gold2);text-shadow:4px 5px 0 #000}
  #overlay .tagline{color:var(--ink);opacity:.9;margin:6px 0 14px;font-size:15.5px;font-style:italic;line-height:1.5;text-shadow:1.5px 1.5px 0 #000}
  #menu{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  #menu>button,#menu>form{width:230px;padding:14px 14px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board);box-shadow:3px 4px 0 rgba(0,0,0,.42);text-align:left;box-sizing:border-box;transition:transform .12s}
  #menu>button:hover{border-color:var(--gold);transform:translateY(-2px)}
  #menu>button.main{background:#4a3a1a;border-color:var(--gold)}
  #menu b{display:block;font-family:var(--head);font-size:22px;line-height:1.05;margin-bottom:4px;color:var(--ink)}
  #menu span{font-size:12.5px;color:var(--dim);line-height:1.4;display:block}
  #menu form{margin:0;display:flex;flex-direction:column;gap:8px}
  #menu input{font:inherit;font-size:18px;letter-spacing:.25em;text-transform:uppercase;padding:6px 8px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--hole);color:var(--ink);width:100%;box-sizing:border-box}
  #records{margin-top:18px;font-size:13px;color:var(--dim);text-shadow:0 1px 4px #000}
  #records b{color:var(--gold2)}
  #ovErr{color:var(--bad);margin-top:12px;min-height:1.2em;font-size:14px}
  #tip{position:fixed;z-index:9;pointer-events:none;max-width:250px;background:#1a1410;border:2px solid var(--pen);border-radius:var(--cut2);padding:7px 9px;font-size:12.5px;line-height:1.4;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2),3px 4px 0 rgba(0,0,0,.45)}
  #tip b{color:var(--gold2)}
  #renown{position:absolute;top:26px;right:24px;font-size:14px;padding:5px 12px;border-radius:var(--cut2);background:var(--board);border:2px solid var(--pen);box-shadow:3px 4px 0 rgba(0,0,0,.42);cursor:help}
  #renown b{color:var(--cool);font-size:16px}
  #renown .rank{font-family:var(--head);font-size:19px;font-weight:700;color:var(--gold2);margin-right:10px}
  #mtabs{display:inline-flex;gap:4px;margin-bottom:14px}
  .mtab{border:2px solid var(--pen);border-radius:var(--cut2);background:var(--board);box-shadow:0 2px 0 var(--pen);padding:6px 15px;font-family:var(--head2);font-weight:700;color:var(--dim);font-size:14px}
  .mtab.on{background:var(--gold);color:#241a08}
  .mtab i{font-style:normal;font-family:var(--body);font-size:11px;margin-left:6px;opacity:.8}
  #mbody{text-align:center}
  .mlabel{font-family:var(--head);font-size:21px;line-height:1;color:var(--gold2);margin:4px 0 8px;text-shadow:2px 2px 0 #000}
  .mrow{display:flex;gap:14px;justify-content:center;margin-bottom:14px;text-align:left}
  .mcol{flex:1;max-width:480px;padding:10px 12px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board);box-shadow:3px 4px 0 rgba(0,0,0,.42)}
  .mcol .mlabel{margin-top:0;text-shadow:none}
  .siege{display:flex;gap:10px;align-items:center}.siege>div{flex:1;text-align:center}
  .siege b{display:block;font-family:var(--head);font-size:22px;line-height:1.1}.siege span{font-size:12px;color:var(--cool)}
  .siege .btn{padding:6px 9px}.siege .btn .ico{margin:0}
  .hint{font-size:12px;color:var(--dim);line-height:1.5}.hint.big{font-size:13.5px;margin-bottom:12px;text-shadow:0 1px 4px #000}.hint.big b{color:var(--gold2)}
  .abts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

  /* Lords, and the tiles of the unlocks, the achievements and the codex */
  #lords{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
  .lord{position:relative;padding:9px 9px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board);box-shadow:2px 3px 0 rgba(0,0,0,.42);text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .12s}
  .lord:hover{transform:translateY(-2px);border-color:var(--gold)}

  .lord.lockd{filter:saturate(.4) brightness(.72)}.lord.lockd:hover{filter:none}
  .lord .li{font-size:27px;line-height:1}
  .lord b{font-family:var(--head2);font-weight:700;font-size:15px;color:var(--ink)}
  .lord span{font-size:11.5px;color:var(--dim);line-height:1.35}
  .lord em{font-style:normal;font-size:11px;color:var(--gold2);line-height:1.35}
  .lord .deep{position:absolute;top:8px;right:8px;font-style:normal;font-size:10.5px;font-weight:800;color:var(--paperink);background:#cfe0ee;border-radius:var(--slip);padding:0 6px;transform:rotate(2deg)}
  .lk{font-style:normal;font-size:11.5px;font-weight:700;color:var(--cool);margin-top:auto;padding-top:4px}.lk small{font-weight:500;color:var(--faint)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
  .tiles.wide{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .tile{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 10px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board);box-shadow:2px 3px 0 rgba(0,0,0,.42);min-height:84px;box-sizing:border-box}
  button.tile:hover{border-color:var(--gold)}
  .tile b{font-family:var(--head2);font-weight:700;font-size:14.5px;color:var(--ink)}.tile span{font-size:11.5px;color:var(--dim);line-height:1.35}
  .tile .ti{font-size:27px;line-height:1;color:var(--ink)}.tile .tp{width:44px;height:44px;border-radius:var(--cut2);background:var(--hole);box-shadow:inset 0 0 0 1.5px var(--pen)}
  .tile.lockd{filter:saturate(.4) brightness(.72)}.tile.can{filter:none;border-color:var(--blue)}
  .tile.own .lk{color:var(--good)}.tile.abt.on{border-color:var(--gold);background:#4a3a1a}
  .tile.abt{min-height:64px;align-items:center;text-align:center}
  .runs{display:flex;flex-direction:column;gap:4px;max-width:560px;margin:0 auto 10px}
  .runs div{display:flex;gap:12px;align-items:center;padding:6px 10px;border-radius:var(--cut2);background:var(--board);border:2px solid var(--pen);text-align:left;font-size:13px}
  .runs span{flex:1;color:var(--dim)}.runs em{font-style:normal;color:var(--cool);font-weight:700}
  .settings{max-width:460px;margin:0 auto;padding:6px 16px 12px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board);box-shadow:3px 4px 0 rgba(0,0,0,.42)}
  .settings .hint{margin-top:10px;line-height:1.9}
  .set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 0;border-top:1px dashed var(--line2);text-align:left}

  .set .btn{min-width:64px}
  .titlebar{display:flex;align-items:center;gap:10px;max-width:540px;margin:0 auto 12px;font-size:12.5px;color:var(--dim);cursor:help}
  .titlebar b{font-family:var(--head);font-size:20px;color:var(--gold2);white-space:nowrap}
  .titlebar .bar{flex:1;margin:0;height:8px}
  .titlebar .bar i{background:var(--blue)}
  .titlebar span{white-space:nowrap}

  /* Speed and abilities */
  #speed{top:14px;left:276px;pointer-events:auto;display:flex;gap:3px;padding:5px}
  #speed button{border:0;background:transparent;color:var(--dim);font-weight:800;font-size:13px;padding:4px 9px;border-radius:var(--cut2)}

  #speed button.on{background:var(--gold);color:#241a08}

  .abil:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}

  .abil .ai{font-size:31px;line-height:1}.abil .an{font-size:12px;font-weight:700}
  .abil:disabled{opacity:.6;cursor:default}
  .abil .acd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:34px;font-weight:700;background:rgba(15,11,9,.72);border-radius:var(--cut);color:var(--ink)}
  .abil .kbd{position:absolute;top:5px;right:6px}

  /* Families, stats and what the castle holds */
  .fam{display:inline-block;font-size:11px;font-style:italic;font-weight:700;margin-left:4px;color:var(--fc)}

  .fams{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}
  .famrow{background:var(--hole);border-radius:var(--cut2);box-shadow:inset 0 0 0 1.5px var(--pen);padding:6px 5px;text-align:center;cursor:help}
  .famrow b{display:block;font-size:11.5px;color:var(--fc)}
  .famrow span{font-family:var(--head);font-size:21px;line-height:1;font-weight:700}
  .famrow.act{box-shadow:inset 0 0 0 2px var(--fc)}
  .famrow .pips{justify-content:center}.famrow .pips i.on{background:var(--fc)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .stat{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line2);padding:5px 2px;font-size:12.5px;cursor:help}
  .stat span{color:var(--dim)}.stat.pos b{color:var(--good)}.stat.neg b{color:var(--bad)}
  .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .item{position:relative;width:36px;height:36px;border-radius:var(--slip);display:flex;align-items:center;justify-content:center;font-size:23px;background:var(--paper);box-shadow:inset 0 0 0 2.5px var(--rc),1px 2px 0 rgba(0,0,0,.45);cursor:help;--edge:transparent}
  /* Inside a row of a panel every span is a line of small text, unless it says otherwise. */
  .row .item{display:flex;font-size:23px;line-height:1;margin:0;color:var(--ink)}
  .row .trait{display:inline-block;font-size:11px;line-height:1.35;margin:0;color:var(--gold2)}.row .trait.spec{color:#d9c6f5}.row .trait.off{color:var(--faint)}
  .item i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:10.5px;font-weight:800;background:var(--gold);color:#241a08;border-radius:var(--slip);padding:0 4px;box-shadow:0 0 0 1.5px var(--pen)}
  .lvrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .lvrow b{font-size:12px;color:var(--cool);min-width:38px}
  .lvrow .bar{flex:1;margin:0;height:7px}

  /* Rewards */
  .choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .choice{width:200px;padding:16px 13px 13px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board2);text-align:left;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;transition:transform .12s}
  .choice::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--rc);border-bottom:1.5px solid var(--pen)}
  .choice:hover{transform:translateY(-3px);border-color:var(--rc)}
  .choice b{font-family:var(--head);font-size:21px;line-height:1.05}
  .choice em{font-style:normal;font-family:var(--head);font-size:30px;line-height:1;font-weight:700;color:var(--rc)}
  .choice .desc{font-size:12px}
  .choice .now{font-size:11.5px;color:var(--faint);margin-top:auto}
  .choice .pi{font-size:34px;line-height:1}.choice .pic{width:64px;height:64px}
  .choice .fam{align-self:flex-start;margin:4px 0 0}
  .pickwrap{width:230px;text-align:left}
  .pickwrap .card{height:100%;box-sizing:border-box}
  .foot{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;color:var(--dim);font-size:12.5px}
  .left{color:var(--gold2);font-weight:700}
  .glow{animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  .panel.event{max-width:560px;text-align:left}.panel.event .pi{font-size:56px;line-height:1;text-align:center;margin-bottom:6px}.panel.event h2,.panel.event p{text-align:center}
  .evopts{display:flex;flex-direction:column;gap:8px}
  .evopt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:var(--cut2);border:2px solid var(--pen);background:var(--board2)}
  .evopt:hover:not(:disabled){border-color:var(--gold)}
  .evopt:disabled{opacity:.45;cursor:default}
  .evopt b{display:block;font-size:14px}.evopt span{font-size:12.5px;color:var(--dim);line-height:1.4}.evopt i{font-style:normal;color:var(--bad)}
  .evopt .kbd{margin-top:2px}
  .renown{margin:4px 0 10px;font-size:13.5px;color:var(--ink)}.renown b{color:var(--cool);font-size:15.5px}
  .achs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
  .ach{font-size:12.5px;font-weight:700;padding:1px 9px 1px 6px;border-radius:var(--slip);background:var(--paper);color:var(--paperink);box-shadow:1px 2px 0 rgba(0,0,0,.45);cursor:help;--edge:transparent;--sw:3px}.ach em{font-style:normal;color:#2f5f86;font-weight:800}
  .tile.ach{font-size:inherit;font-weight:inherit;padding:9px 10px;background:var(--board);color:inherit;box-shadow:2px 3px 0 rgba(0,0,0,.42);cursor:default;--edge:initial;--sw:initial}

  /* Paths of ages */
  #modal>.panel.paths{max-width:min(1060px,calc(100% - 40px));max-height:calc(100% - 40px);overflow:auto}
  .paths .pickwrap{width:310px}
  .card.path{gap:7px}
  .pathage{background:var(--hole);border-radius:var(--cut2);box-shadow:inset 0 0 0 1.5px var(--pen);padding:6px 8px;display:flex;flex-direction:column;gap:3px}
  .pathage b{font-family:var(--head2);font-weight:700;font-size:14.5px;color:var(--gold2)}
  .pathage span{font-size:11.5px;color:var(--dim);line-height:1.35}
  .pathage span i{font-style:normal;color:var(--ink);font-weight:700}
  .pathage .cls{display:flex;gap:10px;flex-wrap:wrap}
  .pathage .cls span{display:inline-flex;align-items:center;gap:4px;color:var(--ink);cursor:help}
  .pathage .cls img{width:22px;height:22px;border-radius:3px;background:var(--hole);box-shadow:inset 0 0 0 1px var(--pen)}
  /* The horde's legacy: a mutation and what comes with it */
  .choice.mut{width:250px;--rc:var(--red)}
  .choice.mut .desc.curse{color:#ffd9cf}
  .choice.mut .now{margin-top:0}
  .boon{display:block;margin-top:auto;background:#22331f;box-shadow:inset 0 0 0 1.5px var(--pen);border-radius:var(--cut2);padding:6px 8px;font-size:12.5px;line-height:1.4;color:#dcf3d2}
  .boon small{display:block;font-size:11px;font-style:italic;font-weight:500;color:var(--good);margin-bottom:2px}
  .choice .boon b{font-family:var(--body);font-size:12.5px}
  /* The Horde tab */
  .wxrow{display:grid;grid-template-columns:70px 108px 1fr;gap:6px;align-items:baseline;margin-top:5px}
  .row .wxrow span,.row .wxrow b{margin:0;font-size:12px}
  .mutrow{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
  .row .mutrow .pi{font-size:22px;line-height:1;width:28px;text-align:center;flex:none;margin:0;color:var(--ink)}
  .row .mutrow b{font-size:12.5px}
  .adapt{margin-top:7px;display:flex;flex-direction:column;gap:5px}
  .adrow{display:grid;grid-template-columns:70px 92px 1fr 30px;gap:6px;align-items:center;cursor:help}
  .row .adrow b{font-size:12px;color:var(--fc)}
  .row .adrow span{margin:0;font-size:11.5px}
  .row .adrow span.neg{color:var(--bad)}.row .adrow span.pos{color:var(--good)}
  .adrow .bar{margin:0;height:7px}.adrow .bar i{background:var(--fc)}
  .adrow em{font-style:normal;font-size:11px;color:var(--faint);text-align:right}
</style>

<body>
<div id="top" class="hud">
  <div id="boss" class="panel" hidden><div class="lbl"><span id="bossName">Boss</span><span id="bossTxt"></span></div><div class="bar" style="height:11px"><i id="bossBar" style="background:var(--red)"></i></div></div>
</div>
<div id="status" class="hud panel" hidden>
  <div id="phase"></div>
  <div id="sub"></div>
  <div class="lbl"><span>Keep</span><b id="thTxt"></b></div>
  <div class="bar"><i id="thBar" style="background:var(--gold)"></i></div>
  <div class="lvrow" data-tip="Castle level. Kills and cleared waves give experience; every level is one upgrade. Ages and buildings need castle levels."><b id="lvTxt"></b><div class="bar"><i id="lvBar" style="background:var(--blue)"></i></div></div>
  <div class="lbl" style="margin-top:10px"><span>Gold</span><span id="goldTxt"></span></div>
  <div class="lbl"><span>Defenders on the walls</span><b id="army"></b></div>
  <div class="lbl"><span>Age</span><b id="ageName"></b></div>
  <div class="lbl"><span>Lord</span><b id="lordName"></b></div>
  <div class="lbl"><span>Siege</span><b id="siegeName"></b></div>
  <div class="lbl" style="margin-top:7px;color:var(--bad)"><span id="bossNext"></span></div>
  <div id="cal"></div>
  <div id="muts" hidden></div>
  <div id="nowFx" hidden></div>
  <button id="ageBtn" class="btn glow" hidden></button>
</div>
<div id="speed" class="hud panel" hidden><button data-spd="0" data-tip="Pause (Space)"><svg class="ico g" aria-hidden="true"><use href="#i-pause"/></svg></button><button data-spd="1">1×</button><button data-spd="2">2×</button><button data-spd="3">3×</button><i class="sep"></i><button data-pause data-tip="Menu and settings (Esc)"><svg class="ico g" aria-hidden="true"><use href="#i-cog"/></svg></button></div>
<div id="dmg"></div>
<div id="advice" class="panel" hidden></div>
<div id="abilities" class="hud" hidden></div>
<div id="shop" class="hud panel" hidden>
  <div id="tabs"></div>
  <div id="tabBody"></div>
</div>
<div id="waves" class="hud panel" hidden></div>
<div id="modal" hidden></div>
<div id="help" class="hud" hidden><span class="kbd">WASD</span> moves the camera, the <span class="kbd">wheel</span> zooms, <span class="kbd">1</span> to <span class="kbd">6</span> choose,<br><span class="kbd">Space</span> pauses, <span class="kbd">Tab</span> turns the panels, <span class="kbd">Esc</span> opens the menu</div>
<div id="toast" class="hud"></div>
<div id="tip" hidden></div>
<div id="overlay">
  <div class="box">
    <div id="renown"></div>
    <h1 id="ovTitle">Hordewall</h1>
    <p class="tagline">Hold the wall against the horde for as long as you can. There is no last wave.</p>
    <div id="mtabs"></div>
    <div id="mbody"></div>
    <div id="ovErr"></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
