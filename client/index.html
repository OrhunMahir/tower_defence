<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kale savunma</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#fff;font-family:system-ui,-apple-system,sans-serif;user-select:none}
  canvas{display:block}
  .hud{position:absolute;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .panel{background:rgba(14,18,24,.62);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px);text-shadow:none}
  .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;width:100%;border-radius:5px;transition:width .12s linear}
  .lbl{font-size:12px;opacity:.8;display:flex;justify-content:space-between;gap:12px}
  #top{top:12px;left:50%;transform:translateX(-50%);text-align:center}
  #phase{font-size:20px;font-weight:600}
  #sub{font-size:13px;opacity:.85;margin-top:2px}
  #ready{pointer-events:auto;margin-top:8px;font:inherit;font-size:14px;padding:7px 16px;border-radius:8px;border:0;background:#e9b949;color:#1b1400;font-weight:600;cursor:pointer}
  #ready[hidden]{display:none}
  #boss{margin-top:8px;width:340px}
  #boss[hidden]{display:none}
  #left{top:12px;left:12px;width:220px}
  #me{bottom:12px;left:12px;width:260px;pointer-events:auto}
  #stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:9px}
  #stats .lbl{grid-column:1/3}
  #stats button{font:inherit;font-size:12px;padding:5px 6px;border-radius:6px;border:1px solid #e9b949;background:rgba(233,185,73,.18);color:#fff;cursor:pointer}
  #stats button:disabled{border-color:rgba(255,255,255,.14);background:transparent;color:rgba(255,255,255,.75);cursor:default}
  #team{top:12px;right:12px;width:180px;font-size:13px}
  #team div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  #help{bottom:12px;right:12px;font-size:12px;opacity:.75;text-align:right;line-height:1.5}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.72);backdrop-filter:blur(4px)}
  #overlay[hidden]{display:none}
  #overlay .box{text-align:center;max-width:640px;padding:24px}
  #overlay h1{font-size:34px;margin:0 0 6px}
  #overlay p{opacity:.8;margin:0 0 20px}
  .classes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .classes button{font:inherit;color:#fff;width:180px;padding:16px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);cursor:pointer;text-align:left}
  .classes button:hover{background:rgba(255,255,255,.16);border-color:#e9b949}
  .classes b{display:block;font-size:18px;margin-bottom:4px}
  .classes span{font-size:13px;opacity:.75;line-height:1.4;display:block}
  #build{top:118px;right:12px;width:270px;pointer-events:auto;font-size:13px;max-height:calc(100% - 200px);overflow:auto}
  #build[hidden]{display:none}
  #build h3{margin:2px 0 6px;font-size:12px;font-weight:600;opacity:.7;text-transform:none}
  #build .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.1);width:100%}
  #build .row b{display:block;font-weight:600}
  #build .row i{font-style:normal;opacity:.65;font-weight:400}
  #build .row span{display:block;font-size:11.5px;opacity:.7;line-height:1.35;margin-top:1px}
  #build button{font:inherit;font-size:12.5px;white-space:nowrap;padding:6px 10px;border-radius:7px;border:0;background:#e9b949;color:#1b1400;font-weight:600;cursor:pointer}
  #build button:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.5);cursor:default}
  #build button.perk{display:block;text-align:left;white-space:normal;background:rgba(233,185,73,.16);color:#fff;border:1px solid #e9b949;margin-bottom:6px;padding:8px 10px}
  #build button.perk:hover{background:rgba(233,185,73,.32)}
  #build p{margin:8px 0 0;font-size:12px;opacity:.75}
  #toast{top:28%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:600;text-align:center;opacity:0;transition:opacity .4s}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="top" class="hud">
  <div id="phase"></div>
  <div id="sub"></div>
  <button id="ready" hidden>Hazırım (Boşluk)</button>
  <div id="boss" class="panel" hidden><div class="lbl"><span>Kraliçe</span><span id="bossTxt"></span></div><div class="bar"><i id="bossBar" style="background:#ff2a6a"></i></div></div>
</div>
<div id="left" class="hud panel">
  <div class="lbl"><span>İç kale</span><span id="thTxt"></span></div>
  <div class="bar"><i id="thBar" style="background:#e9b949"></i></div>
  <div class="lbl" style="margin-top:10px"><span>Ortak altın</span><span id="gold">0</span></div>
</div>
<div id="team" class="hud panel"></div>
<div id="me" class="hud panel">
  <div class="lbl"><span id="meName"></span><span id="hpTxt"></span></div>
  <div class="bar"><i id="hpBar" style="background:#4cc36b"></i></div>
  <div class="lbl" style="margin-top:8px"><span id="lvl"></span><span id="xpTxt"></span></div>
  <div class="bar" style="height:6px"><i id="xpBar" style="background:#5aa9ff"></i></div>
  <div id="stats"></div>
</div>
<div id="build" class="hud panel" hidden></div>
<div id="help" class="hud">WASD: hareket · Fare: nişan · Sol tık: saldırı<br>Boşluk: hazır · 1/2/3: sınıf değiştir (hazırlıkta) · Tekerlek: yakınlaştır</div>
<div id="toast" class="hud"></div>
<div id="overlay">
  <div class="box">
    <h1 id="ovTitle">Kale savunma</h1>
    <p id="ovText">Sınıfını seç. Dalgalar arasında değiştirebilirsin.</p>
    <div class="classes" id="classes">
      <button data-c="knight"><b>Şövalye</b><span>Kılıç ve kalkan. Surun dibinden ve gediklerde yakın dövüş, en yüksek can.</span></button>
      <button data-c="archer"><b>Okçu</b><span>Yay. Surların üzerinden uzak menzil, hızlı atış, tek hedef.</span></button>
      <button data-c="mage"><b>Büyücü</b><span>Asa. Yavaş ama patlayan büyü, alan hasarı.</span></button>
    </div>
  </div>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
