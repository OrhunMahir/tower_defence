<!doctype html>
<!-- The cartoon looks side by side: the same castle, the same moment, four ways of drawing it.
     Run "npm run build", serve the repository folder with any static server and open /scripts/looks.html.
     ?look=ink shows one of them alone at full size. Not part of the game. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hordewall looks</title>
<style>
  html,body{margin:0;height:100%;background:#17120f;overflow:hidden;font:15px Georgia,serif}
  #grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;height:100%}
  #grid.one{grid-template-columns:1fr;grid-template-rows:1fr}
  .cell{position:relative;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block}
  .cell b{position:absolute;left:10px;top:8px;padding:2px 10px;background:#eadcbb;color:#2a1f17;border-radius:2px 4px 3px 5px;box-shadow:1px 2px 0 rgba(0,0,0,.5);font-weight:bold}
</style>
</head>
<body>
<div id="grid"></div>
<script>
  // What every frame does, so that the four pictures show the same moment: ?do=wave starts a wave, ?zoom=0.5 moves the camera in.
  const ask = new URLSearchParams(location.search), only = ask.get('look');
  const looks = [['ink', 'Ink and paint'], ['paper', 'Paper cut-out'], ['comic', 'Comic'], ['water', 'Watercolour']].filter(([k]) => !only || k === only || only === 'all');
  if (ask.has('plain')) looks.unshift(['', 'As it is now']);
  const grid = document.getElementById('grid');
  if (looks.length === 1) grid.className = 'one';
  grid.innerHTML = looks.map(([k, name]) => `<div class="cell"><iframe src="../dist/index.html?dev${k ? `&look=${k}` : ''}"></iframe><b>${name}</b></div>`).join('');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const key = (doc, k) => doc.defaultView.dispatchEvent(new doc.defaultView.KeyboardEvent('keydown', { key: k, code: /^[a-z]$/.test(k) ? `Key${k.toUpperCase()}` : /^\d$/.test(k) ? `Digit${k}` : k, bubbles: true }));
  for (const frame of document.querySelectorAll('iframe')) frame.addEventListener('load', async () => {
    const doc = frame.contentDocument, win = frame.contentWindow;
    // A tab in the background gets a frame only now and then. ?fast draws on a timer instead,
    // so that the light has settled by the time a picture is taken.
    if (ask.has('fast')) win.requestAnimationFrame = (cb) => win.setTimeout(() => cb(win.performance.now()), 16);
    await wait(1200);
    const fresh = () => [...doc.querySelectorAll('#menu button')].find((b) => /^New run/.test(b.textContent.trim()));
    fresh()?.click(); await wait(300);
    if (!doc.getElementById('overlay').hidden) fresh()?.click();
    await wait(1200);
    [...doc.querySelectorAll('button')].find((b) => /No tips/.test(b.textContent))?.click();
    if (!ask.has('hud')) for (const id of ['waves', 'status', 'shop', 'speed', 'help', 'advice', 'abilities', 'toast', 'dmg']) { const e = doc.getElementById(id); if (e) e.style.display = 'none'; }
    for (const k of (ask.get('keys') || '')) { key(doc, k); await wait(500); }
    const turns = Math.round(Math.log(Number(ask.get('zoom') || 1)) / Math.log(1.15));
    for (let i = 0; i < Math.abs(turns); i++) doc.querySelector('canvas').dispatchEvent(new WheelEvent('wheel', { deltaY: turns < 0 ? -150 : 150, bubbles: true }));
  });
</script>
</body>
</html>
