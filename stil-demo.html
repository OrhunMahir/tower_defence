<head>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif}

    background:rgba(20,24,30,.6);color:#fff;cursor:pointer;backdrop-filter:blur(6px)}
  button.on{background:#fff;color:#111}
  #hint{position:absolute;bottom:12px;left:12px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="ui">
  <button data-p="day" class="on">Gündüz</button>
  <button data-p="sunset">Gün batımı</button>
  <button data-p="night">Gece</button>
</div>
<div id="hint">Sürükle: döndür · Tekerlek: yakınlaştır</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const rnd=(()=>{let s=1234567;return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9cc4e4);
scene.fog=new THREE.FogExp2(0x9cc4e4,0.006);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,1,600);

const hemi=new THREE.HemisphereLight(0xcfe4ff,0x4a5a30,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.5);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-48,right:48,top:48,bottom:-48,near:1,far:220});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.04;
scene.add(sun);scene.add(sun.target);

function canvasTex(size,draw){
  const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
const brickTex=canvasTex(256,(g,s)=>{
  g.fillStyle='#4a4742';g.fillRect(0,0,s,s);
  for(let r=0;r<8;r++){const off=r%2?32:0;for(let c=-1;c<4;c++){const v=120+rnd()*50|0;
    g.fillStyle=`rgb(${v+8},${v+4},${v-6})`;g.fillRect(c*64+off+2,r*32+2,60,28);}}
  for(let i=0;i<3500;i++){g.fillStyle=`rgba(0,0,0,${rnd()*0.14})`;g.fillRect(rnd()*s,rnd()*s,2,2);}
});
const woodTex=canvasTex(128,(g,s)=>{
  for(let i=0;i<8;i++){const v=70+rnd()*30|0;g.fillStyle=`rgb(${v+35},${v},${v-35})`;g.fillRect(i*16,0,15,s);}
  g.fillStyle='rgba(0,0,0,.4)';for(let i=0;i<8;i++)g.fillRect(i*16+15,0,1,s);
});
const roofTex=canvasTex(128,(g,s)=>{
  g.fillStyle='#555';g.fillRect(0,0,s,s);
  for(let r=0;r<8;r++)for(let c=0;c<9;c++){const v=150+rnd()*70|0;g.fillStyle=`rgb(${v},${v},${v})`;
    g.fillRect(c*16+(r%2?8:0)-8,r*16,15,14);}
});
function stoneMat(rx,ry){const t=brickTex.clone();t.needsUpdate=true;t.repeat.set(rx,ry);
  return new THREE.MeshStandardMaterial({map:t,roughness:.95});}
function roofMat(color,rx,ry){const t=roofTex.clone();t.needsUpdate=true;t.repeat.set(rx,ry);
  return new THREE.MeshStandardMaterial({map:t,color,roughness:.8,flatShading:true});}
const stonePlain=new THREE.MeshStandardMaterial({color:0x8f8b84,roughness:.95});
const woodMat=new THREE.MeshStandardMaterial({map:woodTex,roughness:.85});
const plaster=new THREE.MeshStandardMaterial({color:0xd9cfb8,roughness:.9});
const winMat=new THREE.MeshStandardMaterial({color:0x2a2418,emissive:0xffb347,emissiveIntensity:.1});
const fireMat=new THREE.MeshStandardMaterial({color:0xff7a1a,emissive:0xff6a00,emissiveIntensity:2});

function mesh(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);
  m.castShadow=m.receiveShadow=true;(parent||scene).add(m);return m;}

function hAt(x,z){
  const d=Math.hypot(x,z),k=Math.min(1,Math.max(0,(d-20)/25)),road=Math.min(1,Math.abs(x)/6);
  const n=Math.sin(x*.13)*Math.cos(z*.11)*1.6+Math.sin(x*.31+z*.2)*.5+Math.cos(z*.27-x*.17)*.4;
  return n*k*(z>0?road:1);
}
{
  const geo=new THREE.PlaneGeometry(320,320,160,160);geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position,col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i);p.setY(i,hAt(x,z));
    const d=Math.hypot(x,z),v=rnd()*.08;
    let r=.07+v*.5,g=.17+v,b=.04+v*.3;
    const dirt=Math.max(Math.min(1,(16-d)/4),(Math.abs(x)<2.2&&z>10)?1:0,0);
    r+=(.20+v-r)*dirt;g+=(.15+v-g)*dirt;b+=(.09+v-b)*dirt;
    col[i*3]=r;col[i*3+1]=g;col[i*3+2]=b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true}));
  m.receiveShadow=true;scene.add(m);
}

const trunkMat=new THREE.MeshStandardMaterial({color:0x5a3d24,roughness:1});
const leafMats=[0x2f5a2a,0x3a6b2e,0x27492a,0x466f33].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));
const rockMat=new THREE.MeshStandardMaterial({color:0x777a7d,roughness:1,flatShading:true});
for(let i=0;i<420;i++){
  const x=(rnd()-.5)*220,z=(rnd()-.5)*220,d=Math.hypot(x,z);
  if(d<25||(Math.abs(x)<8&&z>0))continue;
  const y=hAt(x,z);
  if(rnd()<.12){const r=mesh(new THREE.DodecahedronGeometry(.6+rnd()*1.2,0),rockMat,x,y+.2,z);r.rotation.set(rnd()*3,rnd()*3,rnd()*3);continue;}
  const s=.8+rnd()*.9,g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);
  mesh(new THREE.CylinderGeometry(.18,.28,1.6,6),trunkMat,0,.8,0,g);
  const lm=leafMats[rnd()*4|0];
  for(let k=0;k<3;k++)mesh(new THREE.ConeGeometry(1.5-k*.35,2,7),lm,0,2.2+k*1.1,0,g);
}

const castle=new THREE.Group();scene.add(castle);
const S=12,H=3.4,T=1.4;
function wall(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1,L=Math.hypot(dx,dz),g=new THREE.Group();
  g.position.set((x1+x2)/2,0,(z1+z2)/2);g.rotation.y=-Math.atan2(dz,dx);castle.add(g);
  mesh(new THREE.BoxGeometry(L,H,T),stoneMat(L/4,H/4),0,H/2,0,g);
  const n=Math.floor(L/1.4);
  for(let i=0;i<n;i++)for(const s of[-1,1])mesh(new THREE.BoxGeometry(.8,.7,.35),stonePlain,-L/2+.7+i*1.4,H+.35,s*(T/2-.18),g);
}
wall(-S,-S,S,-S);wall(-S,-S,-S,S);wall(S,-S,S,S);wall(-S,S,-2.6,S);wall(2.6,S,S,S);
mesh(new THREE.BoxGeometry(5.6,1.3,T+.3),stoneMat(1.4,.4),0,H+.1,S,castle);
for(const s of[-1,1]){const d=mesh(new THREE.BoxGeometry(2.5,H-.6,.25),woodMat,s*1.9,(H-.6)/2,S+.2,castle);d.rotation.y=s*-1.1;d.position.z=S+1.2;d.position.x=s*2.3;}

function tower(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);castle.add(g);
  mesh(new THREE.CylinderGeometry(1.9,2.1,6.2,14),stoneMat(4,2),0,3.1,0,g);
  mesh(new THREE.CylinderGeometry(2.25,2.25,.6,14),stonePlain,0,6.3,0,g);
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const c=mesh(new THREE.BoxGeometry(.8,.7,.4),stonePlain,Math.cos(a)*2.05,6.95,Math.sin(a)*2.05,g);c.rotation.y=-a+Math.PI/2;}
  mesh(new THREE.ConeGeometry(2,2.6,14),roofMat(0x4a5d78,6,2),0,8.2,0,g);
  mesh(new THREE.BoxGeometry(.3,.7,.1),winMat,0,4.4,2.0,g).rotation.y=0;
}
tower(-S,-S);tower(S,-S);tower(-S,S);tower(S,S);

{
  const g=new THREE.Group();g.position.set(0,0,-4);castle.add(g);
  mesh(new THREE.BoxGeometry(7,5.5,7),stoneMat(2,1.5),0,2.75,0,g);
  for(let i=0;i<5;i++)for(const s of[-1,1]){
    mesh(new THREE.BoxGeometry(.8,.7,.4),stonePlain,-2.8+i*1.4,5.85,s*3.3,g);
    mesh(new THREE.BoxGeometry(.4,.7,.8),stonePlain,s*3.3,5.85,-2.8+i*1.4,g);}
  mesh(new THREE.BoxGeometry(4.4,4,4.4),stoneMat(1.2,1),0,7.5,0,g);
  const r=mesh(new THREE.ConeGeometry(3.6,3.4,4),roofMat(0x8a3a2e,4,2),0,11.2,0,g);r.rotation.y=Math.PI/4;
  mesh(new THREE.BoxGeometry(1.6,2.6,.2),woodMat,0,1.3,3.55,g);
  for(const x of[-2.2,2.2])mesh(new THREE.BoxGeometry(.6,1,.1),winMat,x,3.4,3.52,g);
  for(const x of[-1,1])mesh(new THREE.BoxGeometry(.5,.9,.1),winMat,x,8,2.22,g);
  mesh(new THREE.CylinderGeometry(.06,.06,3,6),trunkMat,0,14.2,0,g);
  const fg=new THREE.PlaneGeometry(1.8,1.1,6,1);fg.translate(.9,0,0);
  window.flag=mesh(fg,new THREE.MeshStandardMaterial({color:0xb3242a,side:THREE.DoubleSide,roughness:.8}),0,15,0,g);
}

function house(x,z,w,d,h,roofC,rot){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot||0;castle.add(g);
  mesh(new THREE.BoxGeometry(w,h,d),plaster,0,h/2,0,g);
  for(const s of[-1,1])mesh(new THREE.BoxGeometry(.18,h,.18),woodMat,s*(w/2),h/2,d/2,g);
  mesh(new THREE.BoxGeometry(w,.18,.18),woodMat,0,h*.6,d/2,g);
  const r=mesh(new THREE.ConeGeometry(Math.max(w,d)*.82,2,4),roofMat(roofC,3,1.5),0,h+1,0,g);r.rotation.y=Math.PI/4;
  mesh(new THREE.BoxGeometry(.8,1.4,.1),woodMat,0,.7,d/2+.03,g);
  mesh(new THREE.BoxGeometry(.5,.5,.1),winMat,w/4+.3,h*.62,d/2+.03,g);
  return g;
}
house(7.5,-6,3.4,3,2.4,0x7a4a32,-Math.PI/2);
house(7.5,2.5,3,3,2.2,0x6b5a3a,-Math.PI/2);
house(-7.5,-7,3,3,2.2,0x7a4a32,Math.PI/2);
{
  const g=new THREE.Group();g.position.set(-7,0,3.5);g.rotation.y=Math.PI/2;castle.add(g);
  mesh(new THREE.BoxGeometry(4,2.6,3.4),stoneMat(1.2,.8),0,1.3,0,g);
  const r=mesh(new THREE.ConeGeometry(3.3,1.8,4),roofMat(0x3d3d44,3,1.5),0,3.5,0,g);r.rotation.y=Math.PI/4;
  mesh(new THREE.BoxGeometry(.9,3.2,.9),stonePlain,1.2,3.4,-.8,g);
  mesh(new THREE.BoxGeometry(1.4,1,.2),fireMat,-.6,.8,1.72,g);
  mesh(new THREE.BoxGeometry(.9,.5,.4),new THREE.MeshStandardMaterial({color:0x2b2b2e,metalness:.8,roughness:.4}),.9,.45,2.6,g);
  mesh(new THREE.CylinderGeometry(.3,.35,.4,8),trunkMat,.9,.2,2.6,g);
}
const torches=[];
function torch(x,y,z,flame){const l=new THREE.PointLight(0xff8a3c,0,22,2);l.position.set(x,y,z);scene.add(l);torches.push(l);
  if(flame){mesh(new THREE.CylinderGeometry(.06,.06,1,6),trunkMat,x,y-.6,z);mesh(new THREE.SphereGeometry(.16,8,6),fireMat,x,y,z).castShadow=false;}}
torch(-3.4,3,S+1,true);torch(3.4,3,S+1,true);torch(-5,1.4,3.5,false);torch(0,3,-0.2,true);

const S3=THREE;
const skin=new S3.MeshStandardMaterial({color:0xd9a273,roughness:.8});
const steel=new S3.MeshStandardMaterial({color:0x9aa3ae,metalness:.85,roughness:.35});
const blade=new S3.MeshStandardMaterial({color:0xe8edf2,metalness:1,roughness:.2});
const leather=new S3.MeshStandardMaterial({color:0x4a3222,roughness:.9});
const orbMat=new S3.MeshStandardMaterial({color:0x7fe8ff,emissive:0x35c8ff,emissiveIntensity:2.5});
const cloth=c=>new S3.MeshStandardMaterial({color:c,roughness:.85});
function human(bodyM,accM,kind){
  const g=new S3.Group();
  const legs=[-1,1].map(s=>{const p=new S3.Group();p.position.set(s*.14,.85,0);g.add(p);
    mesh(new S3.CylinderGeometry(.11,.09,.7,8),bodyM,0,-.38,0,p);mesh(new S3.BoxGeometry(.17,.14,.32),leather,0,-.78,.05,p);return p;});
  if(kind=='mage')mesh(new S3.ConeGeometry(.52,1.3,12),accM,0,.72,0,g);
  mesh(new S3.CylinderGeometry(.33,.25,.72,12),bodyM,0,1.22,0,g);
  mesh(new S3.CylinderGeometry(.275,.275,.1,12),leather,0,.9,0,g);
  mesh(new S3.SphereGeometry(.19,14,10),skin,0,1.8,0,g);
  const arms=[-1,1].map(s=>{const p=new S3.Group();p.position.set(s*.43,1.5,0);g.add(p);
    mesh(new S3.SphereGeometry(.16,10,8),kind=='knight'?bodyM:accM,0,0,0,p).scale.set(1,.8,1);
    mesh(new S3.CylinderGeometry(.085,.075,.6,8),bodyM,0,-.32,0,p);mesh(new S3.SphereGeometry(.09,8,6),skin,0,-.66,0,p);return p;});
  mesh(new S3.BoxGeometry(.62,1.05,.04),accM,0,1.0,-.31,g).rotation.x=.12;
  if(kind=='knight'){
    mesh(new S3.BoxGeometry(.34,.95,.04),accM,0,1.05,.3,g);
    mesh(new S3.SphereGeometry(.23,14,8,0,Math.PI*2,0,Math.PI*.6),steel,0,1.82,0,g);
    mesh(new S3.BoxGeometry(.05,.22,.04),steel,0,1.76,.21,g);
    mesh(new S3.ConeGeometry(.07,.42,8),accM,0,2.14,-.03,g);
    mesh(new S3.BoxGeometry(.07,.03,.95),blade,0,-.66,.56,arms[1]);mesh(new S3.BoxGeometry(.3,.05,.06),leather,0,-.66,.08,arms[1]);
    mesh(new S3.CylinderGeometry(.42,.42,.06,6),accM,0,-.42,.17,arms[0]).rotation.x=Math.PI/2;
    mesh(new S3.SphereGeometry(.09,8,6),steel,0,-.42,.22,arms[0]);arms[0].rotation.x=-.7;
  }
  if(kind=='archer'){
    mesh(new S3.ConeGeometry(.27,.44,10),accM,0,1.99,-.03,g);
    mesh(new S3.CylinderGeometry(.09,.09,.6,8),leather,.14,1.35,-.38,g).rotation.z=-.3;
    mesh(new S3.TorusGeometry(.55,.028,6,18,Math.PI),leather,-.43,1.45,.7,g).rotation.set(0,-Math.PI/2,-Math.PI/2);
    mesh(new S3.CylinderGeometry(.006,.006,1.1,4),blade,-.43,1.45,.7,g);
    arms[0].rotation.x=-1.45;arms[1].rotation.x=-.9;
  }
  if(kind=='mage'){
    mesh(new S3.CylinderGeometry(.38,.38,.03,14),accM,0,1.93,0,g);mesh(new S3.ConeGeometry(.25,.62,12),accM,0,2.24,0,g);
    mesh(new S3.CylinderGeometry(.035,.035,2.1,6),leather,.52,1.05,.3,g);
    mesh(new S3.SphereGeometry(.15,12,10),orbMat,.52,2.2,.3,g).castShadow=false;
    arms[1].rotation.x=-1;
  }
  g.scale.setScalar(1.2);return {g,legs,arms,kind};
}
const heroes=[['knight',steel,0x2f6fd0,0,S+5.6],['archer',cloth(0x5b4a32),0x3d7a3a,-2.8,S+4.2],['mage',cloth(0x40305e),0x6a3fb0,2.8,S+4.2]]
  .map(([k,bm,c,x,z])=>{const h=human(bm,cloth(c),k);h.g.position.set(x,0,z);scene.add(h.g);return h;});
const orbLight=new S3.PointLight(0x55d0ff,1.2,9,2);orbLight.position.set(3.4,2.7,S+4.6);scene.add(orbLight);

const bone=new S3.MeshStandardMaterial({color:0xd8cdb4,roughness:.7});
const hideM=[0x3b3f47,0x4b403a,0x2b2233].map(c=>new S3.MeshStandardMaterial({color:c,roughness:.75,flatShading:true}));
const glowM=[0xff5a1a,0xff8a1a,0xff2a6a].map(c=>new S3.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.8}));
function beast(t){
  const hide=hideM[t],glow=glowM[t],g=new S3.Group();
  mesh(new S3.SphereGeometry(.5,10,8),hide,0,.82,-.1,g).scale.set(.78,.7,1.5);
  mesh(new S3.SphereGeometry(.47,10,8),hide,0,.95,.5,g).scale.set(.95,.95,1);
  const head=new S3.Group();head.position.set(0,1.02,.95);g.add(head);
  mesh(new S3.SphereGeometry(.32,10,8),hide,0,0,.1,head).scale.set(.85,.7,1.1);
  mesh(new S3.ConeGeometry(.2,.62,6),hide,0,-.02,.6,head).rotation.x=Math.PI/2;
  const jaw=new S3.Group();jaw.position.set(0,-.14,.25);head.add(jaw);
  mesh(new S3.BoxGeometry(.24,.06,.6),hide,0,0,.3,jaw);
  for(let i=0;i<4;i++)for(const s of[-1,1])mesh(new S3.ConeGeometry(.025,.1,4),bone,s*.09,.07,.12+i*.13,jaw);
  for(const s of[-1,1]){
    mesh(new S3.SphereGeometry(.05,6,6),glow,s*.2,.08,.3,head).castShadow=false;
    const h=mesh(new S3.ConeGeometry(.07,.5,6),bone,s*.2,.22,-.12,head);h.rotation.set(-1.1,0,s*-.35);
  }
  for(let i=0;i<6;i++){const k=1-i*.12;mesh(new S3.ConeGeometry(.07*k,.42*k,5),glow,0,1.32-i*.05,.55-i*.28,g).rotation.x=-.35;}
  const tail=new S3.Group();tail.position.set(0,.8,-.8);g.add(tail);
  mesh(new S3.ConeGeometry(.2,1.5,6),hide,0,0,-.7,tail).rotation.x=-Math.PI/2;
  const legs=[[1,.48],[-1,.48],[1,-.55],[-1,-.55]].map(([s,z])=>{const p=new S3.Group();p.position.set(s*.34,.78,z);g.add(p);
    mesh(new S3.CylinderGeometry(.12,.07,.66,7),hide,0,-.33,0,p);mesh(new S3.BoxGeometry(.18,.1,.32),hide,0,-.73,.08,p);
    for(let c=-1;c<2;c++)mesh(new S3.ConeGeometry(.025,.12,4),bone,c*.06,-.74,.28,p).rotation.x=Math.PI/2;return p;});
  if(t==1){
    const f=mesh(new S3.CylinderGeometry(.85,.85,.1,7),bone,0,1.25,.72,g);f.rotation.x=Math.PI/2-.25;f.scale.set(1,1,.85);
    for(const s of[-1,1])mesh(new S3.SphereGeometry(.3,8,6),bone,s*.42,1.05,.35,g).scale.set(.7,.5,1.1);
  }
  if(t==2){
    for(let i=-2;i<=2;i++){const h=mesh(new S3.ConeGeometry(.08,.9-Math.abs(i)*.15,6),bone,i*.16,.45,-.05,head);h.rotation.set(-.5,0,-i*.28);}
    for(let i=0;i<5;i++)for(const s of[-1,1])mesh(new S3.ConeGeometry(.05,.34,5),glow,s*.3,1.1,.4-i*.3,g).rotation.z=s*-.9;
  }
  return {g,legs,jaw,tail,t};
}
const enemies=[];
function spawn(t,n,sp,sc){for(let i=0;i<n;i++){const z=beast(t);z.g.rotation.y=Math.PI;z.g.scale.setScalar(sc*(.9+rnd()*.2));
  z.x=t==2?0:(rnd()-.5)*22;z.z=t==2?44:19+rnd()*50;z.sp=sp*(.85+rnd()*.3);z.ph=rnd()*6;scene.add(z.g);enemies.push(z);}}
spawn(0,34,2.4,.8);spawn(1,9,1.2,1.35);spawn(2,1,.7,3.4);

{const seen=new Set();scene.traverse(o=>{const m=o.material;if(m&&!seen.has(m)){seen.add(m);m.color.convertSRGBToLinear();if(m.emissive)m.emissive.convertSRGBToLinear();}});}
const presets={
  day:{sky:0x8db8dc,fog:.0045,hs:0xcfe4ff,hg:0x4a5a30,hi:.38,sc:0xfff1d6,si:2.1,sp:[40,60,25],ex:1,win:.1,tor:0},
  sunset:{sky:0xe39a62,fog:.009,hs:0xffc9a0,hg:0x3a3a30,hi:.28,sc:0xff9550,si:2.0,sp:[62,17,18],ex:1,win:1,tor:1.2},
  night:{sky:0x0b1424,fog:.013,hs:0x4a6aa8,hg:0x101820,hi:.22,sc:0x8fb0ff,si:.6,sp:[-30,50,30],ex:1.15,win:2.2,tor:3}
};
function apply(n){const p=presets[n];
  scene.background.setHex(p.sky);scene.fog.color.setHex(p.sky);scene.fog.density=p.fog;
  hemi.color.setHex(p.hs);hemi.groundColor.setHex(p.hg);hemi.intensity=p.hi;
  sun.color.setHex(p.sc);sun.intensity=p.si;sun.position.set(...p.sp);
  renderer.toneMappingExposure=p.ex;winMat.emissiveIntensity=p.win;torches.forEach(t=>t.intensity=p.tor);
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.dataset.p===n));
}
document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>apply(b.dataset.p));
apply(new URLSearchParams(location.search).get('p')||'day');

let ang=.55,elev=.6,rad=70,drag=null;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{if(!drag)return;ang-=(e.clientX-drag[0])*.005;elev=Math.min(1.35,Math.max(.2,elev+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY];});
el.addEventListener('pointerup',()=>drag=null);
el.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(140,Math.max(22,rad*(1+e.deltaY*.001)));},{passive:false});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const clock=new THREE.Clock(),target=new THREE.Vector3(0,2,6);
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(!drag)ang+=dt*.04;
  camera.position.set(target.x+Math.cos(elev)*Math.sin(ang)*rad,target.y+Math.sin(elev)*rad,target.z+Math.cos(elev)*Math.cos(ang)*rad);
  camera.lookAt(target);
  for(const z of enemies){
    z.z-=z.sp*dt;if(z.z<S+7.5+(z.t==2?4:0)){z.z=58+rnd()*14;if(z.t!=2)z.x=(rnd()-.5)*22;}
    const w=Math.sin(t*4.2*Math.max(z.sp,1)+z.ph);
    z.g.position.set(z.x,hAt(z.x,z.z)+Math.abs(w)*.08*z.g.scale.y,z.z);
    z.legs.forEach((l,i)=>l.rotation.x=(i==0||i==3?1:-1)*w*.7);
    z.jaw.rotation.x=.15+Math.abs(w)*.3;z.tail.rotation.y=w*.35;
  }
  heroes.forEach((h,i)=>{
    if(h.kind=='knight')h.arms[1].rotation.x=-1.3+Math.sin(t*5)*.9;
    else h.g.position.y=Math.sin(t*2+i)*.03;
  });
  orbMat.emissiveIntensity=2.2+Math.sin(t*4)*.8;
  flag.rotation.y=Math.sin(t*2.2)*.35;
  fireMat.emissiveIntensity=1.8+Math.sin(t*17)*.3+Math.sin(t*7.3)*.3;
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
frame();
</script>
